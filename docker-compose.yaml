# Docker Compose stack for the late-delivery prediction platform.
# Each group of services has a profile. Start the core services with:
#   docker compose --profile core up -d
# Values such as ${POSTGRES_USER} come from the local .env file (copy .env.example).
# Every port binds to 127.0.0.1, so nothing is reachable from outside this Mac.

name: ${COMPOSE_PROJECT_NAME:-late-delivery-prediction}

# Environment shared by DataHub's system-update job and GMS (profile gov). The metadata lives in
# the datahub database of the shared Postgres, the search index in OpenSearch, and the event
# topics in the core Kafka. GMS runs DataHub's internal schema registry.
x-datahub-env: &datahub-env
  EBEAN_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datahub
  EBEAN_DATASOURCE_DRIVER: org.postgresql.Driver
  EBEAN_DATASOURCE_USERNAME: ${POSTGRES_USER}
  EBEAN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  EBEAN_DATASOURCE_HOST: postgres:5432
  ELASTICSEARCH_HOST: opensearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: "false"
  ELASTICSEARCH_IMPLEMENTATION: opensearch
  ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
  ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
  ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: "false"
  KAFKA_BOOTSTRAP_SERVER: kafka:19092
  KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
  SCHEMA_REGISTRY_TYPE: INTERNAL
  USE_CONFLUENT_SCHEMA_REGISTRY: "false"
  GRAPH_SERVICE_IMPL: elasticsearch
  ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
  DATAHUB_SQL_SETUP_ENABLED: "true"
  DATAHUB_PRECREATE_TOPICS: "true"   # the broker does not auto-create topics
  PARTITIONS: "1"
  METADATA_SERVICE_AUTH_ENABLED: "false"   # GMS listens on 127.0.0.1 and the compose network only
  DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SIGNING_KEY}
  DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SALT}
  DATAHUB_GMS_HOST: datahub-gms
  DATAHUB_GMS_PORT: "8080"
  DATAHUB_TELEMETRY_ENABLED: "false"

services:
  # ---------- core: the source systems and the event broker ----------

  # One Postgres server with five databases (created by infra/postgres/init/):
  # oms (the order system, a source), dwh (the warehouse), airflow, metastore, datahub.
  postgres:
    image: postgres:16.15
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"   # 15432 on the Mac, because a local Postgres already uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      retries: 20

  # SeaweedFS: S3-compatible object storage for the app exports and the lakehouse.
  # The admin S3 identity comes from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
  # -volume.max=0 sizes the volume count from free disk; the default (8 x 30 GB) caps it at 240 GB.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # filer UI (browse files)
      - "127.0.0.1:9333:9333"   # master UI
    volumes:
      - seaweedfs_data:/data
    # A clean shutdown takes about 26 s; at the default 10 s, Docker kills it (exit 137).
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8333/healthz >/dev/null"]
      interval: 5s
      retries: 20

  # One-shot job: creates the buckets once SeaweedFS is healthy, then exits.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    profiles: [core]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in app-exports lakehouse; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
        done
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333

  # Kafka in KRaft mode (no ZooKeeper). Containers use kafka:19092; the Mac uses 127.0.0.1:9092.
  kafka:
    image: apache/kafka:3.9.2
    profiles: [core]
    hostname: kafka
    environment:
      CLUSTER_ID: RN8dnrXdR86lHrmMKXzTIA   # from kafka-storage.sh random-uuid; fixed so the volume stays valid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by kafka-init
      KAFKA_LOG_DIRS: /var/lib/kafka/data        # the image default is /tmp, which a restart loses
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 15s

  # One-shot job: creates the topics once Kafka is healthy, then exits.
  kafka-init:
    image: apache/kafka:3.9.2
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:19092 --create --if-not-exists --topic parcel-scans --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:19092 --create --if-not-exists --topic parcel-scans-replay --partitions 1 --replication-factor 1
        $$T --bootstrap-server kafka:19092 --create --if-not-exists --topic hub-delivery-5m --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:19092 --create --if-not-exists --topic scans-late --partitions 1 --replication-factor 1
        # The scan records carry their 2024 event time as the record timestamp. Time-based retention
        # judges a segment by those timestamps, so the 7-day default deletes them minutes after they
        # are written. The producer and the Flink runs empty these topics themselves.
        for t in parcel-scans parcel-scans-replay hub-delivery-5m scans-late; do
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:19092 --alter --entity-type topics --entity-name $$t --add-config retention.ms=-1
        done
        $$T --bootstrap-server kafka:19092 --list

  # ---------- lakehouse: catalog and Spark (profile batch; the metastore also serves query) ----------

  # Hive Metastore: the catalog of lakehouse tables, stored in the metastore database. Spark and
  # Trino look tables up here. On first start it creates its schema; later starts reuse it.
  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    profiles: [batch, query]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore
      HIVE_METASTORE_USER: ${POSTGRES_USER}
      HIVE_METASTORE_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_METASTORE_WAREHOUSE_DIR: s3a://lakehouse/warehouse
      HIVE_METASTORE_HEAPSIZE_IN_KB: "524288"   # 512 MB heap, set explicitly (docs/environment.md)
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE_ACCESS: "true"
      # The image's start script requires these to exist, even empty.
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    ports:
      - "127.0.0.1:9083:9083"   # Thrift
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      retries: 18
      start_period: 30s

  # Spark standalone: one master, one worker, and the history server for finished jobs. Jobs run
  # inside spark-master with spark-submit, so the driver UI of a running job is on :4040.
  spark-master:
    build:
      context: ./infra/spark
      dockerfile: Dockerfile.naive
    image: lastleg/spark:3.5.9-naive
    profiles: [batch]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment: &spark-env
      SPARK_DAEMON_MEMORY: 512m
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"   # master UI
      - "127.0.0.1:4040:4040"   # UI of the job running in this container
    volumes: &spark-volumes
      # Config is mounted as a folder: a single-file mount keeps pointing at the old file after git
      # replaces it (for example on checkout), and the container then cannot find it.
      - ./infra/spark/conf:/opt/spark/conf:ro
      - ./jobs:/opt/jobs:ro
      - spark_events:/opt/spark/events
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080 >/dev/null"]
      interval: 10s
      retries: 12

  spark-worker:
    image: lastleg/spark:3.5.9-naive
    profiles: [batch]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4g}
      # Delete the work folders of applications that ended over an hour ago, checked every 30 min.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=3600
    ports:
      - "127.0.0.1:8081:8081"   # worker UI
    volumes: *spark-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081 >/dev/null"]
      interval: 10s
      retries: 12

  spark-history:
    image: lastleg/spark:3.5.9-naive
    profiles: [batch]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "127.0.0.1:18080:18080"   # history UI
    volumes: *spark-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:18080 >/dev/null"]
      interval: 10s
      retries: 12

  # ---------- query: SQL over the lakehouse (profile query) ----------

  # Trino reads the Delta tables through the Hive Metastore (catalog "delta"), for DBeaver and
  # DataHub. Its JVM heap is 80% of the memory it sees, so mem_limit caps it at 2 GB.
  trino:
    image: trinodb/trino:479
    profiles: [query]
    depends_on:
      hive-metastore:
        condition: service_healthy
    mem_limit: 2g
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8090:8080"   # Trino (8080 on the Mac is the Spark master UI)
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro   # a folder, for the same reason as Spark's conf
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      retries: 18
      start_period: 20s

  # ---------- orch: Airflow (profile orch; runs on top of core and batch) ----------

  # One-shot: migrates the airflow database, creates the admin user, then the connections,
  # variables and pool (airflow/setup_airflow.py). Only this container reads .env; the others get
  # the credentials from Airflow's (Fernet-encrypted) connections.
  airflow-init:
    build:
      context: ./infra/airflow
      dockerfile: Dockerfile.naive
    image: lastleg/airflow:2.10.5-naive
    profiles: [orch]
    user: "185:0"   # the Spark user, so drivers here can write the shared event logs
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"   # look for new DAG files every 30 s (default 300)
      AIRFLOW__DATAHUB__ENABLED: ${DATAHUB_ENABLED:-true}   # lineage to DataHub; DATAHUB_ENABLED=false without profile gov
    command: >-
      bash -c "airflow db migrate >/dev/null && echo 'metadata database ready'
      && (airflow users create --role Admin --username admin --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      --firstname Admin --lastname Local --email admin@example.invalid >/dev/null 2>&1 || true)
      && python /opt/airflow/setup_airflow.py"
    volumes:
      - ./airflow/setup_airflow.py:/opt/airflow/setup_airflow.py:ro

  airflow-webserver:
    image: lastleg/airflow:2.10.5-naive
    profiles: [orch]
    user: "185:0"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "127.0.0.1:8082:8080"   # UI: user admin, password AIRFLOW_ADMIN_PASSWORD from .env
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./jobs:/opt/jobs:ro
      - ./infra/spark/conf:/opt/spark/conf:ro
      - spark_events:/opt/spark/events
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health >/dev/null"]
      interval: 15s
      retries: 20
      start_period: 30s

  # The scheduler runs the tasks (LocalExecutor). A Spark task's driver runs here (client mode),
  # with the Python of /opt/driver-python; the executors run on spark-worker and connect back to
  # this hostname.
  airflow-scheduler:
    image: lastleg/airflow:2.10.5-naive
    profiles: [orch]
    user: "185:0"
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      PYSPARK_DRIVER_PYTHON: /opt/driver-python/bin/python
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8974/health >/dev/null"]
      interval: 15s
      retries: 20
      start_period: 30s

  # ---------- gov: DataHub (profile gov; runs on top of core) ----------

  # Search and graph index of DataHub.
  opensearch:
    image: opensearchproject/opensearch:2.19.7
    profiles: [gov]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m   # the image default is 1 GB (docs/environment.md)
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=0s'"]
      interval: 10s
      retries: 20
      start_period: 60s

  # One-shot: the SQL schema, the search indices and the Kafka topics, then it exits.
  datahub-system-update:
    image: acryldata/datahub-upgrade:v1.5.0.6
    profiles: [gov]
    command: ["-u", "SystemUpdate"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      <<: *datahub-env
      # Only here, as in DataHub's quickstart: on GMS too, its consumers stop and nothing is indexed.
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      JAVA_OPTS: -Xms256m -Xmx512m

  # The metadata service: REST API and graph, with its Kafka consumers built in.
  datahub-gms:
    image: acryldata/datahub-gms:v1.5.0.6
    profiles: [gov]
    hostname: datahub-gms
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    environment:
      <<: *datahub-env
      JAVA_OPTS: -Xms512m -Xmx1g   # the image sets no heap, so the JVM would take 25% of the VM
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      UI_INGESTION_ENABLED: "false"   # recipes run from the command line (datahub/recipes/)
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
      ES_BULK_REFRESH_POLICY: NONE
      DATAHUB_SERVER_TYPE: quickstart
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
    ports:
      - "127.0.0.1:8083:8080"   # 8080 on the Mac is the Spark master UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:8080/health"]
      interval: 10s
      retries: 30
      start_period: 90s

  # The UI. Its login comes from DATAHUB_ADMIN_PASSWORD, written to user.props at start, so no
  # password file is committed.
  datahub-frontend:
    image: acryldata/datahub-frontend-react:v1.5.0.6
    profiles: [gov]
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: ${DATAHUB_SECRET}
      DATAHUB_APP_VERSION: v1.5.0.6
      DATAHUB_ADMIN_PASSWORD: ${DATAHUB_ADMIN_PASSWORD}
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      ELASTIC_CLIENT_HOST: opensearch
      ELASTIC_CLIENT_PORT: "9200"
      JAVA_OPTS: -Xms256m -Xmx512m
    command: ["/bin/sh", "-c", "printf 'datahub:%s\\n' \"$$DATAHUB_ADMIN_PASSWORD\" > /datahub-frontend/conf/user.props && exec ./start.sh"]
    ports:
      - "127.0.0.1:9002:9002"   # UI: user datahub, password DATAHUB_ADMIN_PASSWORD from .env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:9002/admin >/dev/null"]
      interval: 15s
      retries: 30
      start_period: 60s

  # ---------- streaming: Flink session cluster (profile stream, on top of core) ----------
  # PyFlink jobs in ./flink/jobs are submitted from the jobmanager:
  #   docker compose exec flink-jobmanager flink run -py /opt/flink/jobs/scan_windows.py --mode baseline
  # They read and write Kafka at kafka:19092.
  flink-jobmanager:
    build:
      context: ./infra/flink
      dockerfile: Dockerfile.naive
    image: lastleg/flink:1.20.5-naive
    profiles: [stream]
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: &flink-properties |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 1
        python.executable: python3
        python.client.executable: python3
        classloader.parent-first-patterns.additional: pemja.   # one pemja per JVM: see infra/flink/Dockerfile.naive
    ports:
      - "127.0.0.1:8084:8081"   # Flink UI (8081 on the Mac is the Spark worker UI)
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null"]
      interval: 10s
      retries: 12

  flink-taskmanager:
    image: lastleg/flink:1.20.5-naive
    profiles: [stream]
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro

volumes:
  postgres_data:
  seaweedfs_data:
  kafka_data:
  spark_events:
  airflow_logs:
  opensearch_data:
