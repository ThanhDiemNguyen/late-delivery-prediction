# Trino catalog "delta": the lakehouse's Delta tables, found through the Hive Metastore and read
# from SeaweedFS with Trino's native S3 file system. Keys come from the container environment.
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
