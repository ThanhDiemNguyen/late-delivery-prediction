# Spark settings shared by the master, the worker, the history server and every job.
# S3 keys come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the container environment.
spark.master                                  spark://spark-master:7077
spark.sql.extensions                          io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog               org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation               hive
spark.hadoop.hive.metastore.uris              thrift://hive-metastore:9083
spark.sql.warehouse.dir                       s3a://lakehouse/warehouse
spark.sql.session.timeZone                    UTC
spark.hadoop.fs.s3a.endpoint                  http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.eventLog.enabled                        true
spark.eventLog.dir                            file:///opt/spark/events
spark.history.fs.logDirectory                 file:///opt/spark/events
spark.driver.memory                           1g
spark.executor.memory                         2g
